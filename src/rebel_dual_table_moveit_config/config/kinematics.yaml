# robot_description_kinematics. Both arm groups end at their xeg32_tool_tip (the TCP).
# KDL like the single-arm config; both_arms has no solver (plan both_arms with joint goals, or
# pose-goal each arm separately).
arm_left:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_timeout: 0.25  # [s] per IK call
  position_only_ik: false
arm_right:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_timeout: 0.25
  position_only_ik: false
