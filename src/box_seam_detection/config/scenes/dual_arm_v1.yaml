# Scene dual_arm_v1 (2026-10-12): dual-arm cell. Camera on its own mount ~0.87 m above the arm's
# base_link looking down ~45 deg, 1.0-1.3 m from the top of the box. Box 39 x 32 x 48 cm (brown, centred
# tape, profile large_392) on a small stand that is SMALLER than the box: the support under the box is
# hidden and the FLOOR is the dominant visible plane (1.5-4.4 m). Hand-eye calibration
# dualcal_20261009_left_single (NOT yet verified by touches); use ..._right_single for the right arm.
scene: dual_arm_v1
description: "dual-arm cell: box on a hidden stand, floor visible, camera 1.0-1.3 m from the top, ~2.7 mm depth noise"
# 2026-10-15 operator: use the hover-corrected left calibration, the same one the cutting stack uses
# (left_single put every point +5.9 mm in x / -6.3 mm in y: top cut ~5 mm too far from the base).
calib_file: /home/farhan/.ros2/easy_handeye2/calibrations/dualcal_20261012_left_hovercorr.calib

depth_top:
  # The floor (z 1.5-4.4 m here) must be inside the crop: it is the support-like plane. Symmetric x/y so
  # the same scene serves either arm's mount.
  ws_x_min: -3.0
  ws_x_max: 3.0
  ws_y_min: -3.0
  ws_y_max: 3.0
  ws_z_min: 0.2
  ws_z_max: 4.6
  support: hidden_stand        # top = large plane parallel to the floor, offset_min..offset_max above it
  offset_min: 0.30             # stand + box above the floor, m (box alone is 0.48; the stand may be low)
  offset_max: 1.50
  support_expand_m: 0.30       # top must project inside the visible floor's footprint +- this (sanity
                               # only: a desk at the same height as the box cannot be told apart from
                               # the box top by depth; the SAM3 ROI retry decides)
  max_planes: 6                # a noisy far floor splits into several RANSAC planes that use up slots
  ransac_thresh: 0.007         # 5 mm keeps only ~45 % of the top at 1.9 m: sparse, unstable plane/support;
                               # 7 mm gave a stable top on both captures (1.2 m and 1.9 m)
  top_rms_max: 0.006           # RMS inside the (wider) band: 3.7-3.8 mm on the 1.9 m top
  min_hull_area_frac: 0.003    # the top covers only 0.8 % of the image at 1.9 m (1 % is the table-cell value)
  measure_noise: true          # the noise-adaptive guided-plane gate reads the scene noise
  top_refit_iters: 12          # converge the top plane on its own 7 mm band (start-independent): the seeded RANSAC
                               # start moved the depth quad IoU of an unmoved box 0.87-0.97 (DESIGN.md "Fixed floor")

v2:
  min_plane_inlier_ratio: 0.80
  max_plane_p95_mm: 8.0
  noise_adaptive:
    enabled: true              # band/p95 limit grow with the measured scene noise (never below the above)
    rms_floor_mm: 1.8          # table cell: 0.7-1.6 mm -> unchanged; here ~2.8 mm
    band_k_mm_per_mm: 4.0
    max_band_mm: 12.0
    p95_k_mm_per_mm: 2.0
    bulge_mm_per_m: 5.0
    bulge_max_mm: 2.0
    bulge_min_side_m: 0.25
    range_model:               # box noise ~ (z_top / z_ref) ** exponent; fitted on the 1.17 m and 1.91 m captures
      z_ref_m: 1.2
      exponent: 0.8
      band_ref_mm: 7.0         # ratio >= 0.8 needs 6 mm @ 1.17 m, 8.7 mm @ 1.91 m (measured)
      p95_ref_mm: 9.5          # p95 residual 9.0 mm @ 1.17 m, 12.9 mm @ 1.91 m (+ lid bulge allowance)

seam_estimator:
  # clear tape over the flap gap hides parts of it: on the new 39 x 28 cm box the gap line was seen on only
  # 34 % of the seam (a straight line, 0.66 px residual). The line must still agree with the midline (4 mm / 2 deg).
  min_coverage: 0.30
  confirm_min_coverage: 0.30
  darkline_min_coverage: 0.30

live:
  seam_direction_prior_deg: null     # 83 deg is the old cell's base_link seam direction: disabled here
  seam_direction_soft_range_deg: 45.0
  rect_tol_mm: 20.0                  # opposite-side gate: 3 mm is for a 110 mm box; on this 390 x 320 mm top the
                                     # systematic depth-plane tilt (2-4 deg) alone gives 8-12 mm (see DESIGN.md)
  # Hard top-size gate (cannot be bypassed by --allow-needs-review / --allow-cut-blocked). Known boxes:
  # 394.5 x 328.6 mm (large_392) and ~390 x 280 mm. A cut-tape carton whose near flap droops is seen as
  # only its flat far flap, ~370-390 x 115-150 mm, which must fail (short side < 230). Position and
  # rotation are free: long/short are the metric side-pair means of the final 3-D quad.
  top_size_range_mm: {long: [330, 450], short: [230, 380]}
  # Robot work area (core/work_area.py, DESIGN.md "Work area"): estimated 2026-10-17 from the dual-arm robot
  # model as the TCP reach of BOTH arms at box-top height, in front of the robot table (x >= 0.11 m = the
  # table front), frame base_link (= arm_left_base_link = the detector's target base_link). UPPER BOUND of
  # what the arms can reach: no collision check, no tool-orientation check. Effects: (1) the cloud is cropped
  # to the polygon + margin_m (all heights) + the dense floor + every `outside_keep_every`-th other point:
  # about half the data, post-SAM3 geometry ~40-50 % faster; (2) SAM3 candidates mostly outside the area
  # prism are ignored; (3) a final top with any corner outside the polygon (no margin) or outside
  # top_z_range_m is a hard reject (work_area), not bypassable by --allow-needs-review / --allow-cut-blocked.
  work_area:
    frame: base_link
    polygon_xy_m: [[0.11, -0.77], [0.28, -0.72], [0.32, -0.67], [0.48, -0.60], [0.65, -0.41],
                   [0.73, -0.24], [0.64, -0.03], [0.49, 0.14], [0.19, 0.29], [0.11, 0.29]]
    top_z_range_m: [-0.20, 0.06]     # allowed base_link z of the box TOP corners (hard reject) and z span of the SAM3
                                     # image-space prism. Operator 2026-10-17: the box top must never be higher than
                                     # today's (z ~ 0.03, +3 cm tolerance) but may be lower; below about -0.20 m the
                                     # two arms' reach drops under ~80 % of the box footprint.
    outside_keep_every: 10           # every 10th other point outside the area is kept (gravity / clutter reference)
    floor_keep_below_z_m: -0.75      # the floor (base z ~ -0.83, 0.6-0.7 M points) stays DENSE: the hidden-stand
                                     # support detection counts absolute plane inliers and ranks planes by size;
                                     # a floor thinned x10 made the support / height checks flip (10 frames,
                                     # DESIGN.md). Re-measure if the camera or the floor level changes.
  # Fixed floor (core/fixed_floor.py, DESIGN.md "Fixed floor"): the floor is ONE plane in base_link, measured
  # 2026-10-17 by a robust fit over 15 captures of 2 box placements (python3 -m box_seam_detection.core.fixed_floor;
  # per-capture fits agree to ~1 mm at the box, tilt 0.33-0.44 deg, depth-noise MAD 7.3 mm, p95 18 mm), used by the
  # hidden-stand top check, support_clearance_mm / support_depth_below_top_m, the trim-plane choice and the independent
  # top check INSTEAD of a per-frame RANSAC facet of the noisy far floor (facets tilted 0-5 deg moved the
  # "floor" by +-100 mm and flipped the verdict of a box that did not move). Every cloud is checked against it:
  # fewer than min_inliers floor points within tolerance_m, less than min_inlier_frac of the +-search_m band, or a
  # band median beyond max_median_offset_m (camera moved / another calibration) -> depth_fixed_floor_mismatch
  # (needs_review, no support_clearance_mm, no height waiver). Re-measure after any camera or calibration change.
  # search_m stays inside the work-area floor_keep_below_z_m (-0.75) dense floor band (floor z -0.832 + 0.07).
  fixed_floor:
    frame: base_link
    normal: [0.000581, 0.006435, 0.999979]
    offset_m: -0.8321
    tolerance_m: 0.02
    search_m: 0.07
    min_inliers: 250000              # measured 496k-508k within tolerance_m on every frame
    min_inlier_frac: 0.5             # measured 0.72-0.74 of the +-0.10 m band
    max_median_offset_m: 0.01        # measured +2.8..+4.4 mm
  generic_cut_without_height: true   # unknown box on the hidden stand: no measured height, but a depth-confirmed
                                     # top with all edges supported may be cut (the executor has its own height).
                                     # The executor's carton collision box reaches the floor: it uses the snapshot's
                                     # support_depth_below_top_m (box + hidden stand, from support_clearance_mm),
                                     # never below its carton_height_m (0.20 m minimum), at most carton_height_max_m.
  driver_extrinsic:
    reference: null                  # no verified reference for this camera: a manifest block is used as
                                     # is (WARNING, never refused); `tf` mode still compares with live TF
    fallback: recorded_constant      # `recorded` run without a manifest block: ASSUMES the same Orbbec
                                     # driver extrinsic (camera_link <- colour optical frame)
    verified: false

truncation_recovery:
  mode: "on"                  # SAM3 sometimes outlines only one flap (back edge -> flap gap): recover the full
                              # top from a containing alternate or the depth-grown coplanar region (DESIGN.md)
