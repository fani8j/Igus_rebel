[develop]
script_dir=$base/lib/rebel_dual_arm_calibration
[install]
install_scripts=$base/lib/rebel_dual_arm_calibration
[tool:pytest]
testpaths = test
# A user-site anyio plugin is incompatible with Ubuntu 22.04's pytest 6.2.5 and
# aborts collection; ROS tests do not use it.
addopts = -p no:anyio
