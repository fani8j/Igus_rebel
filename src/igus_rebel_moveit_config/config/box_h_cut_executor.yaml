# box_h_cut_executor parameters -- ONLY values that differ from the code defaults, plus a few
# operator-facing ones kept for visibility. Every parameter NOT listed here uses its code
# default: see the field<...> table in src/box_h_cut_executor.cpp (lines ~839-1030; name, scope,
# default). Trimmed 2026-10-02 from a 97-parameter file with no effective change; the effective
# parameter set is identical (verified by `ros2 param dump` on a mock stack).
#
# Change semantics (`ros2 param set /box_h_cut_executor ...`):
# - READ-ONLY (startup only; `param set` is rejected; edit this file and restart): tool_link,
#   external_snapshot_max_age_s, allow_tool_carton_contact, approach_joint_degrees, clearances,
#   middle_blade_reversed, all *_scaling, top_cut_* offsets/lifts, side_tape_continue_* gates,
#   side_tape_handoff_*_axis_tool and retract/servo gates.
# - PLANNING (validated, applied, retained plan cleared; "busy" while a plan/execute/cut-debug
#   session or side-tape hand-off is active): motion_profile, cut_pattern, side tilts,
#   pre_cut_stabilization_duration_s, left_parallel_*, cut_debug_*_correction_file,
#   side_tape_handoff_enabled/variant/standoff_mm/box_offset/max_search_angle.
# - RUNTIME (read when used, never blocked): execution_enabled, debug_motion_execution_enabled,
#   left_roll_diagnostics_enabled, external_snapshot_file.
# Numeric values must be finite; out-of-range values fail closed.
box_h_cut_executor:
  ros__parameters:

    # ---- Snapshot & frames ------------------------------------------------------------
    # Saved approach/combined targets predate the calibrated TCP; revalidate before reuse.
    tool_link: xeg32_tool_tip
    # Canonical carton snapshot written atomically by the external vision repo.
    external_snapshot_file: /home/farhan/Igus_rebel/outputs/seam_3d_base_link.json
    # Refuse an older snapshot when planning is not started promptly. (0, 600] s.
    external_snapshot_max_age_s: 240.0
    # Only the TCP proxy may touch the detected carton, only in descend/traverse/retract
    # stages. The TCP is a 6 mm visual marker with no collision geometry.
    allow_tool_carton_contact: true

    # ---- Pattern & motion profile -----------------------------------------------------
    # ompl_cartesian: free-space transits use the nearest exact-pose IK branch (joint
    # interpolation, then OMPL); contact strokes are Cartesian paths (min_fraction=1.0).
    motion_profile: ompl_cartesian
    # left_only, middle_only, right_only, h, combined, t_cut, t_cut_handoff (+ debug aids).
    cut_pattern: t_cut
    # Joint-space transit used only by cut_pattern h. joint5 94.0 = the URDF-limit-clamped 94.37.
    approach_joint_degrees: [51.52, 15.99, 124.79, -65.84, 94.0, 125.94]
    # Hold at the final approach pose before each descend/cut stage, [0, 10] s.
    pre_cut_stabilization_duration_s: 1.0

    # ---- Speeds (fractions of joint_limits.yaml: 0.785 rad/s, 5.24 rad/s^2) -------------
    # Contact strokes: 0.1376*0.785 = 0.108 rad/s, 0.0954*5.24 = 0.50 rad/s^2 (operator-approved
    # rescale 2026-09-27). Finite, in (0, 1].
    velocity_scaling: 0.1376
    acceleration_scaling: 0.0954
    # Free-space transit only. Lowered 2026-09-29 after real-robot moves overshot at transit
    # ends (operator): 0.20*0.785 = 0.157 rad/s (~9 deg/s); 0.10*5.24 = 0.52 rad/s^2.
    transit_velocity_scaling: 0.20
    transit_acceleration_scaling: 0.10

    # ---- Clearances & side tilts ------------------------------------------------------
    # Signed distance along surface_normal: positive hovers, negative penetrates the top plane.
    # Source validation caps side penetration at 3 mm and middle penetration at 5 mm.
    hover_clearance_m: 0.01
    cut_clearance_m: -0.001
    # Middle seam only: 1 mm deeper than the side cuts.
    middle_cut_clearance_m: -0.002
    # Roll about the blade axis per side (batch scan over 59 boxes: -10 left, -5 right).
    left_side_cut_tilt_deg: -10.0
    right_side_cut_tilt_deg: -5.0

    # ---- Left side cut (taught correction + hand-off to side_tape) --------------------
    # Learned per-cut records (schema box_h_cut_correction/v1). Only applied when
    # cut_debug_correction_enabled is true (default false); empty = none.
    cut_debug_left_correction_file: "/home/farhan/cut_debug_corrections/left_capture_frame_000001_20260916_235239_389784_orient_only_tcp20260924.json"
    cut_debug_middle_correction_file: "/home/farhan/cut_debug_corrections/middle_capture_frame_000001_20260914_200444_020309.json"
    # Geometry-derived LEFT orientation, blade as parallel to the top face as reachable.
    # The side-tape hand-off REQUIRES it (fails closed otherwise).
    left_parallel_orientation_enabled: false
    # Side-tape hand-off (left face): ~/plan_side_tape_handoff plans the full left cut for
    # feasibility, executes only the approach to the cut start; side_tape_ros (Servo + knife
    # camera) then cuts. ~/side_tape_retract ends it. Off by default.
    side_tape_handoff_enabled: false
    # in_material: stop at the planned in-material start. standoff: withdrawn along the face
    # normal to side_tape_handoff_standoff_mm outside the outer wall.
    side_tape_handoff_variant: in_material
    side_tape_handoff_standoff_mm: 9.0
    # Operator correction (2026-09-30, measured on the real box), base_link mm: x/y shift the
    # whole snapshot (carton, cut line, seed wall plane); z shifts only the left cut line
    # (seam height). Applies to every later hand-off plan until reset to [0, 0, 0].
    side_tape_handoff_box_offset_base_mm: [0.6, -12.3, -8.4]
    # Max |tilt|,|pitch|,|yaw| the search may add on top of the base pose; side_tape refuses
    # above ~10 deg. Also floors the axis-convention tolerance.
    side_tape_handoff_max_search_angle_deg: 20.0
    # Left-cut orientation search IK: "analytic" (closed-form, all branches, ~1 s answers;
    # falls back to kdl if its startup self-check fails) or "kdl" (old behaviour). Restart to change.
    left_search_ik_backend: analytic
    # continue_side_cut (all operator decisions 2026-09-30): skip the snapshot-age check (box
    # does not move; alignment can outlast external_snapshot_max_age_s); stroke speed is a
    # fraction of velocity/acceleration_scaling (0,1]; stroke ends 5 mm past the planned cut
    # end toward the box edge ([-20, 20] mm); extra end depth [0, 10] mm; do not refuse when
    # the stroke end is deeper than side_tape_continue_max_depth_mm (only logged).
    side_tape_continue_check_snapshot_age: false
    side_tape_continue_speed_factor: 0.5
    side_tape_continue_end_extension_mm: 5.0
    side_tape_continue_end_extra_depth_mm: 0.0
    side_tape_continue_check_end_depth: false

    # ---- Top (middle seam) cut --------------------------------------------------------
    # Blade faces opposite travel (rotated 180 deg about the surface normal), operator
    # 2026-10-01; applies to every middle cut (staged top cut and t_cut/h/combined).
    middle_blade_reversed: true
    # Staged top cut, taught by teleop 2026-10-01 (snapshot capture_frame_000001_20261001_025532_980481,
    # flipped blade): cut-local [along seam start->end, across, depth (+ = deeper)] mm vs the
    # planned start/end. along/across move the seam points (hover follows); depth applies to
    # the cut targets only. Poses in scan_results/top_cut_teach_20261001/.
    top_cut_start_offset_mm: [-11.1, -3.8, 11.8]
    top_cut_end_offset_mm: [-6.3, -3.3, 12.1]
    # Hold at the penetration pose before the cut stroke (every middle-seam plan).
    top_cut_post_penetration_dwell_s: 1.0
    # Tip height above the top after the top-cut lift (staged/continue only), [0.001, 0.05] m.
    top_cut_lift_clearance_m: 0.010
    # continue_top_cut skips the snapshot-age check (operator 2026-10-01; box must not move).
    top_cut_continue_check_snapshot_age: false
    # continue_top_cut: straight base +Z lift from the current pose before the transit to the
    # top hover, so the arm does not swing low over the table (table not in the scene).
    top_cut_pre_transit_lift_m: 0.05

    # ---- Safety / execution gates (both default false; keep false in the file) ---------
    # Physical trajectory dispatch stays disabled until an operator deliberately enables it.
    execution_enabled: false
