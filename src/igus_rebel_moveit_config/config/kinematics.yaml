# robot_description_kinematics
# kinematics_solver_attempts is ignored since MoveIt 2 Humble, and
# kinematics_solver_search_resolution only affects redundant joints (the arm has 6 DoF),
# so neither is set.
igus_rebel_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_timeout: 0.25  # [s] per IK call
  position_only_ik: false

# TRAC-IK (not installed; there is no Humble apt binary, so build the ROS 2 trac_ik
# packages from source into src/ first, then replace the block above with this one and
# rebuild/relaunch). Distance returns the
# solution closest to the seed state, which suits the wrist-branch-sensitive H-cut transits.
# Re-run the H-cut mock regression before any physical use.
# igus_rebel_arm:
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
#   kinematics_solver_timeout: 0.25
#   solve_type: Distance
#   position_only_ik: false
