# Gemini 305 on the RIGHT arm's knife (arm_right). Same settings as
# wrist_camera.yaml (left arm); passed to gemini_301_series.launch.py.
camera_name: right_wrist_camera   # TF frame prefix; topics are /arm_right/wrist_camera (cameras.launch.py)
serial_number: CV27561000NP   # 2026-10-15: assigned to the right arm

enable_color: true
color_width: 1280
color_height: 800
color_fps: 15
color_format: MJPG         # less USB bandwidth; shares a bus with the 336

enable_depth: true
depth_width: 1280
depth_height: 800
depth_fps: 15

depth_registration: true
align_mode: SW
align_target_stream: COLOR
enable_frame_sync: true

enable_point_cloud: false
enable_colored_point_cloud: false

enable_temporal_filter: true
