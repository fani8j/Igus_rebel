# usb_cam parameters for the LEFT arm's gripper camera (arm_left),
# "HD USB Camera" 05a3:9230. Published as /arm_left/gripper_camera/...
#
# Both gripper cameras are the same model with no USB serial number, so they
# are told apart by USB port (/dev/v4l/by-path), not by-id: 3.2 = right,
# 3.3 = left (2026-10-26: the hub moved to PC port 3 after a reboot; before:
# 1.1 right, 1.2 left). Swapping the cables or moving the hub changes the
# paths; the launch warning lists where the gripper cameras are. by-path names
# have no bus number, so "usb-0:3.1" also matches a USB3 device on hub port 1
# (bus 2); the supervisor's --usb-id check refuses such a device.
/**:
  ros__parameters:
    video_device: "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:3.3:1.0-video-index0"
    camera_name: "arm_left_gripper_camera"
    frame_id: "arm_left_gripper_camera_optical_frame"
    camera_info_url: ""   # uncalibrated
    # Camera JPEG passthrough on image_raw/compressed (no decode, ~1 % CPU);
    # there is no raw image_raw topic in this mode. See knife_camera.yaml.
    pixel_format: "raw_mjpeg"
    av_device_format: "YUV422P"
    image_width: 1280
    image_height: 720
    framerate: 30.0
    io_method: "mmap"
    brightness: -1        # -1 = leave the camera's own setting
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1
    auto_white_balance: true
    autoexposure: true
    autofocus: false
    focus: -1
