# Gemini 336, static scene camera. Passed to orbbec_camera's
# gemini_330_series.launch.py as config_file_path (keys are its launch args).
# camera_name must stay "camera": perception topics (/camera/...), the hand-eye
# TF (camera_link) and camera_pole_collision.py depend on it.
camera_name: camera
serial_number: CP96563000LY

enable_color: true
color_width: 1920          # seam pipeline intrinsics are 1080p
color_height: 1080
color_fps: 15
color_format: MJPG         # RGB measured no cheaper here

enable_depth: true
depth_width: 1280
depth_height: 800
depth_fps: 15
device_preset: High Accuracy

depth_registration: true
align_mode: SW
align_target_stream: COLOR
enable_frame_sync: true

# Only the colored (registered) cloud is used. The node builds it only while
# something subscribes, and then it costs ~1 core (1.66 M points at 1080p).
enable_point_cloud: false
enable_colored_point_cloud: true

# Halves temporal depth noise on a static scene (measured 1.46 -> 0.74 mm
# median); take snapshots ~1 s after the scene is still.
enable_temporal_filter: true

# Color exposure. 60 Hz mains -> lights ripple at 120 Hz (8.33 ms period).
# Plain AE picked 15.6 ms and beat against the lights (slow +/-7/255 swing);
# whole-frame AE also overexposed the white table. Trial 2026-10-02: AE metered
# on the table with anti-flicker (exposure should stay on 8.33 ms multiples).
enable_color_auto_exposure: true
color_powerline_freq: 60hz
color_anti_flicker: true
color_ae_roi_left: 400
color_ae_roi_right: 1500
color_ae_roi_top: 450
color_ae_roi_bottom: 1079
# Proven fallback (stable, table ~229/255, carton ~143/255): set
# enable_color_auto_exposure: false and uncomment:
# color_exposure: 83   # 8.3 ms, units of 0.1 ms
# color_gain: 16
# Auto white balance: a fixed 4600 K turned the carton neutral grey under morning
# daylight (2026-10-03: white table R-B -19, carton warmth 24 -> 1), which breaks the
# warm-colour carton mask in detect_tape_seam. Flicker came from exposure, not WB.
enable_color_auto_white_balance: true

# Image transports: only what consumers use (aruco_verification and cut_recorder
# read color compressed; box perception reads raw; depth compressedDepth kept
# for recording, re-added 2026-10-26). Drops color theora. depth/image_unaligned
# (+ its transports), */metadata, device_status and depth_filters/status are
# hard-coded in orbbec_camera 2.9.3;
# nothing is encoded or sent on a topic nobody subscribes to.
color.image_raw.enable_pub_plugins: ["image_transport/compressed", "image_transport/raw"]
depth.image_raw.enable_pub_plugins: ["image_transport/compressedDepth", "image_transport/raw"]

# QoS stays at the driver default (RELIABLE). Tried BEST_EFFORT (SENSOR_DATA)
# 2026-10-31: color raw and points lost about half their frames on this PC
# (6 MB frames vs a 212 KB UDP receive buffer). Subscribers use best effort.
