# DERIVED FROM compal_robot dual_arm_ros_controllers.yaml @ bb76327 (MIT, see ../NOTICE); gripper controllers removed, 200 Hz like our rebel config.
# One JointTrajectoryController per MoveIt group, position command interface.
controller_manager:
  ros__parameters:
    update_rate: 200 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gantry_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_left_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_right_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gantry_trajectory_controller:
  ros__parameters:
    joints:
      - lift_joint
      - slider_left_joint
      - slider_right_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm_left_trajectory_controller:
  ros__parameters:
    joints:
      - arm_left_joint1
      - arm_left_joint2
      - arm_left_joint3
      - arm_left_joint4
      - arm_left_joint5
      - arm_left_joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm_right_trajectory_controller:
  ros__parameters:
    joints:
      - arm_right_joint1
      - arm_right_joint2
      - arm_right_joint3
      - arm_right_joint4
      - arm_right_joint5
      - arm_right_joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]
