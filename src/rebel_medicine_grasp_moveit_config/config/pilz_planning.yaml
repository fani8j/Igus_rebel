# Pilz pipeline, Humble format (same adapters as igus_rebel_moveit_config/launch/move_group.launch.py HUMBLE_PILZ_REQUEST_ADAPTERS). Planner ids: PTP, LIN, CIRC.
planning_plugin: pilz_industrial_motion_planner/CommandPlanner
request_adapters: default_planner_request_adapters/FixWorkspaceBounds default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
default_planner_config: PTP
