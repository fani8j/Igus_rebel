# MoveIt - medicine grasp. DERIVED FROM compal_robot dual_arm_ros_controllers.yaml @ bb76327 (MIT, see ../NOTICE) via rebel_dual_arm_stand_moveit_config, 200 Hz.
# + right_gripper_controller: a JointTrajectoryController on the one actuated LEHF finger (mimic follower is applied by robot_state_publisher / MoveIt;
# chosen over GripperActionController because it works unchanged with mock_hardware and gives MoveIt a plain FollowJointTrajectory action for the group).
# One JointTrajectoryController per MoveIt group, position command interface.
controller_manager:
  ros__parameters:
    update_rate: 200 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gantry_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_left_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_right_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gantry_trajectory_controller:
  ros__parameters:
    joints:
      - lift_joint
      - slider_left_joint
      - slider_right_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm_left_trajectory_controller:
  ros__parameters:
    joints:
      - arm_left_joint1
      - arm_left_joint2
      - arm_left_joint3
      - arm_left_joint4
      - arm_left_joint5
      - arm_left_joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm_right_trajectory_controller:
  ros__parameters:
    joints:
      - arm_right_joint1
      - arm_right_joint2
      - arm_right_joint3
      - arm_right_joint4
      - arm_right_joint5
      - arm_right_joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_gripper_controller:
  ros__parameters:
    joints:
      - arm_right_finger_left_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
