# MoveIt - medicine grasp. DERIVED FROM compal_robot dual_arm_moveit_controllers.yaml @ bb76327 (MIT, see ../NOTICE) via rebel_dual_arm_stand_moveit_config; + right_gripper_controller.
# Only used when the launch argument allow_trajectory_execution:=true (default false = plan-only).
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.02
  execution_duration_monitoring: false

controller_names:
  - gantry_trajectory_controller
  - arm_left_trajectory_controller
  - arm_right_trajectory_controller
  - right_gripper_controller

gantry_trajectory_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - lift_joint
    - slider_left_joint
    - slider_right_joint

arm_left_trajectory_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - arm_left_joint1
    - arm_left_joint2
    - arm_left_joint3
    - arm_left_joint4
    - arm_left_joint5
    - arm_left_joint6

arm_right_trajectory_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - arm_right_joint1
    - arm_right_joint2
    - arm_right_joint3
    - arm_right_joint4
    - arm_right_joint5
    - arm_right_joint6

right_gripper_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - arm_right_finger_left_joint
