camera:
  image_topic: /knife_camera/image_raw
  width: 1280
  height: 720
  rotate_180: true
mount:
  mount_id: uncalibrated
  calibrated: true
  tip_uv:
  - 705.10360683863
  - 209.5793584295889
  J:
  - - -7.978591912692873
    - 1.4363881752149157
  - - 0.24140745333872282
    - -7.380710049168425
target:
  offset_mm: -0.67
  edge_polarity: null
  max_edge_angle_deg: 20.0
  parallax_mm_per_mm: -0.41
  align_standoff_mm: 9.0
detector:
  refine: robust
  target: seam
  seam_glare_mode: none   # 2026-10-06: benchmark max 2.66->0.76 mm, visual review: right line on clear tape
  seam_column_validity: true   # 2026-10-06: box-end/corner fix (a20 3/3), other frames identical; v3 not yet (needs robot check)
control:
  v_cut_mps: 0.005
  retract_mm: 5.0
  v_retract_mps: 0.003
  v_lat_max_mps: 0.002
  align_timeout_s: 20.0
  align_tol_mm: 0.2
tracker:
  coast_frames: 15
  min_conf: 0.15
  use_polarity: false
robot:
  carton_allowed_links:
  - xeg32_tool_tip
  - xeg32_knife_handpiece
  - xeg32_knife_holder
  - xeg32_base_link
  - xeg32_left_carriage_link
  - xeg32_right_carriage_link
