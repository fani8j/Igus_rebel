controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rebel_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rebel_arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

rebel_arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]

    # gains:
    #   joint1: { p: 4.0, i: 0.0, d: 0.01, i_clamp: 0.0, ff_velocity_scale: 1.0 }
    #   joint2: { p: 4.0, i: 0.0, d: 0.005, i_clamp: 0.0, ff_velocity_scale: 0.9 }
    #   joint3: { p: 4.0, i: 0.0, d: 0.005, i_clamp: 0.0, ff_velocity_scale: 1.0 }
    #   joint4: { p: 4.0, i: 0.0, d: 0.05, i_clamp: 0.0, ff_velocity_scale: 0.9 }
    #   joint5: { p: 3.0, i: 0.0, d: 0.05, i_clamp: 0.0, ff_velocity_scale: 1.0 }
    #   joint6: { p: 4.0, i: 0.0, d: 0.005, i_clamp: 0.0, ff_velocity_scale: 1.0 }
    gains:
      joint1: { p: 4.0, i: 0.0, d: 0.005, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint2: { p: 4.0, i: 0.0, d: 0.0,   i_clamp: 0.0, ff_velocity_scale: 0.9 }
      joint3: { p: 4.0, i: 0.0, d: 0.02,  i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint4: { p: 4.0, i: 0.0, d: 0.05,  i_clamp: 0.0, ff_velocity_scale: 0.9 }
      joint5: { p: 4.0, i: 0.0, d: 0.01,  i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint6: { p: 4.0, i: 0.0, d: 0.05,  i_clamp: 0.0, ff_velocity_scale: 1.0 }
    # gains:
    #   joint1: { p: 10.0, d: 5.0, i: 0.02, i_clamp: 5.0, ff_velocity_scale: 1.0 }
    #   joint2: { p: 5.0, d: 2.0, i: 0.01, i_clamp: 5.0, ff_velocity_scale: 1.0 }
    #   joint3: { p: 5.0, d: 2.0, i: 0.01, i_clamp: 5.0, ff_velocity_scale: 1.0 }
    #   joint4: { p: 5.0, d: 2.0, i: 0.01, i_clamp: 5.0, ff_velocity_scale: 1.0 }
    #   joint5: { p: 5.0, d: 2.0, i: 0.01, i_clamp: 5.0, ff_velocity_scale: 1.0 }
    #   joint6: { p: 5.0, d: 2.0, i: 0.01, i_clamp: 5.0, ff_velocity_scale: 1.0 }

rebel_arm_velocity_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]
