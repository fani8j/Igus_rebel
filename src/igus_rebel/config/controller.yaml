controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rebel_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

rebel_arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]

    # D gains are 0: in the 2026-09-09 tuning runs d = 0 ... 0.05 made no measurable
    # difference (RMS/peak error within run-to-run noise), and the D term acts on the
    # velocity estimated from 20-30 ms STATUS samples, which only adds noise.
    gains:
      joint1: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint2: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.9 }
      joint3: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint4: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.9 }
      joint5: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
      joint6: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }

    # Trajectory tolerances. Chosen from the 2026-09-09 real-arm tuning bags
    # (~/rebel_controller_tuning, best gains, velocity scaling 0.1): normal tracking lag
    # peaked at 5.5-8.3 deg (0.10-0.145 rad) and the final approach is a first-order decay
    # with tau ~0.7 s. They abort a goal on a runaway or stalled joint, not in normal tracking.
    #  - trajectory 0.25 rad: ~1.7x the worst observed normal peak lag.
    #  - goal 0.02 rad: ~2.3x the observed error when the tuning runs were declared settled.
    #  - goal_time 3.0 s: 0.1 rad -> 0.02 rad needs ~1.1 s at tau 0.7 s; a 1.0 s limit
    #    would abort normal moves. 0 would wait forever (MoveIt duration monitoring is off).
    #  - stopped_velocity_tolerance 0.05 rad/s: the goal check also requires |velocity| below
    #    this; near the goal the arm still creeps at ~1.5 * error rad/s.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 3.0
      joint1: {trajectory: 0.25, goal: 0.02}
      joint2: {trajectory: 0.25, goal: 0.02}
      joint3: {trajectory: 0.25, goal: 0.02}
      joint4: {trajectory: 0.25, goal: 0.02}
      joint5: {trajectory: 0.25, goal: 0.02}
      joint6: {trajectory: 0.25, goal: 0.02}
