controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rebel_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

rebel_arm_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]

    # Gains validated on the real left arm 2026-10-31 together with jog_velocity_scale 1.65
    # (launch/xacro default; they assume that scale). History: 2026-09-09 p 4 / ff 1.0 (tuned at
    # robot override ~30-37 %) overshot 15.5 deg at override 100; 2026-09-30 p 1 / ff 0.4 (sim);
    # 2026-10-26 sim fit scale 1.65 + p 3 / ff 0.6 + planned accel cap 0.4 rad/s^2. Real ladder
    # S0-S7: 0 overshoot, final error 0.000 deg, settle to 0.05 deg in 0.08-0.2 s (the one
    # peak/plan 1.11 "fail" is STATUS stamp jitter in the 0.2 s window metric). The robot speeds up
    # at ~0.55 rad/s^2 max (brakes on zero jog at ~1.5), so keep planned accelerations <= 0.4 rad/s^2
    # (box_h_cut_executor.yaml). D = 0: it acts on a velocity estimated from 20-30 ms STATUS samples
    # and only adds noise. Evidence: scan_results/jtc_tracking_real_20261026/run_real_20261031_A/ and
    # scan_results/jog_speed_check_20261031/.
    gains:
      joint1: { p: 3.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.6 }
      joint2: { p: 3.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.6 }
      joint3: { p: 3.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.6 }
      joint4: { p: 3.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.6 }
      joint5: { p: 3.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.6 }
      joint6: { p: 3.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 0.6 }

    # Trajectory tolerances. Chosen from the 2026-09-09 real-arm tuning bags
    # (~/rebel_controller_tuning, best gains, velocity scaling 0.1): normal tracking lag
    # peaked at 5.5-8.3 deg (0.10-0.145 rad) and the final approach is a first-order decay
    # with tau ~0.7 s. They abort a goal on a runaway or stalled joint, not in normal tracking.
    #  - trajectory 0.25 rad: ~1.7x the worst observed normal peak lag.
    #  - goal 0.02 rad: ~2.3x the observed error when the tuning runs were declared settled.
    #  - goal_time 3.0 s: 0.1 rad -> 0.02 rad needs ~1.1 s at tau 0.7 s; a 1.0 s limit
    #    would abort normal moves. 0 would wait forever (MoveIt duration monitoring is off).
    #  - stopped_velocity_tolerance 0.0 (disabled; was 0.05 rad/s): joint_trajectory_controller
    #    applies these "goal" tolerances to every trajectory it receives, including each
    #    single-point message MoveIt Servo streams to this same topic (command_out_topic in
    #    servo.yaml). Servo's points legitimately end with a nonzero target velocity (that's
    #    what keeps it moving smoothly into the next point) that the real velocity-tracking
    #    error can exceed right when a streamed burst starts (2026-09-29 real-arm bag: teleop
    #    and side_tape commands were silently dropped because "State tolerances failed ...
    #    Velocity Error: -0.0799, Velocity Tolerance: 0.05" then "Exceeded goal_time_tolerance:
    #    holding position"). A velocity-at-goal check is meaningless for a point whose whole
    #    purpose is to still be moving, so it is disabled; the position `goal` tolerance above
    #    and `goal_time` below still catch a stalled/runaway joint at the end of a planned
    #    (action-based) MTC trajectory, and Servo's own per-cycle position delta is far under
    #    the 0.02 rad goal tolerance so it does not trip that check either.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 3.0
      joint1: {trajectory: 0.25, goal: 0.02}
      joint2: {trajectory: 0.25, goal: 0.02}
      joint3: {trajectory: 0.25, goal: 0.02}
      joint4: {trajectory: 0.25, goal: 0.02}
      joint5: {trajectory: 0.25, goal: 0.02}
      joint6: {trajectory: 0.25, goal: 0.02}
