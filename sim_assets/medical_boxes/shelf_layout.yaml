# How the cartons are stocked in the medicine cabinet (sim_assets/medicine_cabinet).
#
# Stocking rule, from the shelf photos (source/setup_photos/): cartons stand upright like
# books, labelled spine facing out of the cabinet front, the spine's long side vertical,
# carton length going into the shelf, packed tight in groups of one product. Which spine
# end is on top follows the operator's own shelf (own_shelf_spines.jpeg); see up_end.
#
# Carton -> world rotation (cabinet frame: X across, Y into the cabinet, front at y=0,
# Z up), for up_end "+X":  carton +X (height) -> world +Z,  carton +Y (spine) -> world -Y,
#         carton +Z (front face) -> world +X.  For "-X" the carton is turned 180 deg about
# world Y: the other spine end is on top and the front faces world -X.
#
# Shelf geometry (top surface, x/y extent, clearance to the next shelf) is read from the
# cabinet USD, not repeated here. Groups fill a shelf left (-X) to right (+X); `fill`
# is the fraction of the shelf width a group gets, and as many cartons as fit go in it.

cabinet: ../../medicine_cabinet/MedicineCabinet.usd   # relative to usd/
cabinet_prim: /MedicineCabinet_V6

# Cabinet (painted steel) physics material. friction_combine_mode "min": PhysX picks the
# higher-priority mode of the two materials (average < min < multiply < max), so the
# carton (average) on shelf (min) pair resolves to min(carton, shelf) = exactly the
# shelf values: static 0.30 / dynamic 0.25 while the carton material is >= those values.
# PhysicsScene settings and the ground "floor" material live in boxes.yaml
# (physics_scene, floor_material) so both generated scenes share them.
shelf_material:
  static_friction: 0.30
  dynamic_friction: 0.25
  restitution: 0.05
  friction_combine_mode: min
  restitution_combine_mode: average

placement:
  spine_setback_m: 0.010      # spine face this far behind the shelf's front edge
  gap_between_m: 0.001        # between neighbouring cartons (keeps PhysX contacts stable)
  drop_height_m: 0.001        # cartons start this far above the shelf surface
  side_margin_m: 0.002        # free space at each cabinet side wall
  min_top_clearance_m: 0.008  # a carton must clear the shelf above by at least this

# Which end of each spine is on top: "+X" = the end at the LEFT of textures/<box>/top.png,
# "-X" = the right end. Set from the operator's shelf (source/setup_photos/own_shelf_spines.jpeg):
# MR, iVascular and Lollipop (right ends) on top; Accuforce and Ultimaster Nagomi (left ends).
# With the spine-to-face connection from tools/match_net.py, the front then faces world -X
# for "-X" boxes and +X for "+X" boxes.
up_end:
  agent_monorail: "-X"
  angiolite: "-X"
  accuforce: "+X"
  ultimaster_nagomi: "+X"
  conqueror_nc_pro: "-X"

# Shelf_07 (top compartment) and the bottom compartment have closed front panels and
# stay empty. Clear heights: 01 300 mm, 02 230, 03 260, 04 310, 05 290, 06 280.
shelves:
  Shelf_01:
    - {box: ultimaster_nagomi, fill: 1.0}
  Shelf_02:                                   # 230 mm clear: only the 220 mm Accuforce fits
    - {box: accuforce, fill: 1.0}
  Shelf_03:
    - {box: agent_monorail, fill: 0.5}
    - {box: conqueror_nc_pro, fill: 0.5}
  Shelf_04:
    - {box: angiolite, fill: 1.0}
  Shelf_05:
    - {box: agent_monorail, fill: 1.0}
  Shelf_06:
    - {box: angiolite, fill: 0.34}
    - {box: accuforce, fill: 0.33}
    - {box: conqueror_nc_pro, fill: 0.33}
