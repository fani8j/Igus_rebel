    size: "4.0 x 19 mm"
    ref: SCCDSR14150400019
    gtin: "08435387305004"
    dims_mm: {height: 240.0, length: 250.0, thickness: 16.0}
    mass_kg: 0.110
    mass_source: estimate
    photo: source/photos/2.jpeg
    textures:
      top: spine photo (source/photos/2.jpeg)
      front: operator photo (source/face_photos/angiolite_front.jpeg)
      back: operator photo (source/face_photos/angiolite_back.jpeg)
      bottom: plain colour
      left: plain colour
      right: plain colour

  accuforce:
    evidence: "Reseller back photo face aspect 0.866 vs measured 220/250 = 0.880. REF DC-RM2512HHW confirmed as 2.5 x 12 mm in Terumo's catalogue and the ANSM recall notice."
    label: "Accuforce"
    brand: "Terumo"
    product: "Terumo Accuforce NC PTCA balloon catheter"
    size: "2.5 x 12 mm"
    ref: DC-RM2512HHW
    dims_mm: {height: 220.0, length: 250.0, thickness: 16.0}
    mass_kg: 0.105
    mass_source: estimate
    photo: source/photos/3.jpeg
    textures:
      top: spine photo (source/photos/3.jpeg)
      front: operator photo (source/face_photos/accuforce_front.jpeg)
      back: operator photo (source/face_photos/accuforce_back.jpeg)
      bottom: plain colour
      left: plain colour
      right: plain colour

  ultimaster_nagomi:
    evidence: "REF DE-RS3024ASM confirmed as 3.0 x 24 mm (Terumo item table, nda.ru). The only front photo found (3.0 x 33 mm carton, India) is cropped and off-axis, so it was not used."
    label: "Ultimaster Nagomi"
    brand: "Terumo"
    product: "Terumo Ultimaster Nagomi sirolimus eluting coronary stent system"
    size: "3.0 x 24 mm"
    ref: DE-RS3024ASM
