# Medical device cartons modelled for Isaac Sim.
#
# Box frame (all boxes): origin at the geometric centre, Z-up, metres.
#   X = "height"    (front artwork left -> right)
#   Y = "length"    (front artwork bottom -> top)
#   Z = "thickness" (+Z = front face; the box lies front-up on a table)
#
# Faces and texture orientation (image right / image up, seen from outside):
#   front  (+Z): right = +X, up = +Y     image size W x H = height x length
#   back   (-Z): right = -X, up = +Y     height x length
#   top    (+Y): right = -X, up = +Z     height x thickness  (the labelled spine)
#   bottom (-Y): right = +X, up = +Z     height x thickness
#   right  (+X): right = +Y, up = +Z     length x thickness
#   left   (-X): right = -Y, up = +Z     length x thickness
#
# Dimensions: the user's caliper measurements (source/photos/size.txt). No manufacturer
# publishes unit-carton dimensions; searches checked manufacturer pages, IFUs,
# catalogs, AccessGUDID, NHS Supply Chain, IndiaMART, EUDAMED/GS1/resale/TFDA
# (2026-10-05).  Cross-check: the straight-on internet photos agree with the
# measured face aspect (height/length): Agent 0.925 vs 0.920, Accuforce back
# 0.866 vs 0.880.
#
# Mass: no published weight was found, so it is ESTIMATED as
#   350 g/m2 folding board x 1.25 (flaps/glue) x outer area + 50 g contents
#   (coiled catheter in hoop dispenser, foil pouch, IFU booklet).
# Replace with a scale reading when available.
#
# Spine: the labelled spine is the +Y (top) face, the edge opposite the "Open here" tuck
# tab, and its text reads upright with the text's "up" towards the front (+Z). The
# operator's face photos confirm this clearly for Agent (the green MR band continues into
# green corners on both faces); for the other four tools/match_net.py could not separate it
# from the 180-degree alternative, so the same convention is used (see the
# usd/previews/<box>_net_match.png nets).

boxes:
  agent_monorail:
    evidence: "Reseller front photo face aspect 0.925 (836x904 px) vs measured 230/250 = 0.920. Spine photo identifies the EU 'MR' variant; catalog/GTIN are the EU and US candidates for 2.75 x 30 mm."
    label: "Agent Monorail"
    brand: "Boston Scientific"
    product: "Boston Scientific Agent Monorail paclitaxel-coated PTCA balloon catheter"
    size: "2.75 x 30 mm"
    catalog_candidates:
      eu: {catalog: H74939222273010, gtin: "08714729831587"}
      us: {catalog: H7493960830270, gtin: "00191506014889"}
    dims_mm: {height: 230.0, length: 250.0, thickness: 15.0}
    mass_kg: 0.105
    mass_source: estimate
    photo: source/photos/1.jpeg
    textures:
      top: spine photo (source/photos/1.jpeg)
      front: operator photo (source/face_photos/agent_monorail_front.jpeg)
      back: operator photo (source/face_photos/agent_monorail_back.jpeg)
      bottom: plain colour
      left: plain colour
      right: plain colour

  angiolite:
    evidence: "REF on the spine matches NHS Supply Chain entry (GTIN 08435387305004). No carton photo or dimension published."
    label: "Angiolite"
    brand: "iVascular"
