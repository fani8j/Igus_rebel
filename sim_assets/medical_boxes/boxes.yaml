      front: "internet photo of the same carton design (REF DC-RM2020HHW, India market): https://5.imimg.com/data5/SELLER/Default/2023/8/333172497/CJ/NZ/ZX/20510505/accuforce-terumo-balloon-catheter-1000x1000.jpg"
      back: "internet photo (same listing): https://5.imimg.com/data5/SELLER/Default/2023/8/333172498/WX/XW/TG/20510505/accuforce-terumo-balloon-catheter-1000x1000.jpg"
